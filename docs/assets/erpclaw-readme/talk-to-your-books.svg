tspan></text><g class="ta13"><rect x="45.86" y="88" width="640" height="22" fill="#0b1519"/><rect class="ta14" x="46.86" y="90" width="8" height="18" fill="#3ee6b0" opacity="0"/></g></g><text class="ta15" x="30" y="148" xml:space="preserve"><tspan fill="#6f8a88">  Run ERPClaw action </tspan><tspan fill="#cfdcda" font-weight="700">&quot;submit-payment&quot;</tspan><tspan fill="#6f8a88"> with user</tspan></text><text class="ta16" x="30" y="170" xml:space="preserve"><tspan fill="#6f8a88">  confirmation. Continue? </tspan><tspan fill="#ffc65a" font-weight="700">[y/N]</tspan></text><text class="ta17" x="299.76" y="170" fill="#ffffff" font-weight="700">y</text><text class="ta18" x="30" y="214" xml:space="preserve"><tspan fill="#ffc65a" font-weight="700">  PAY-2026-00001</tspan><tspan fill="#cfdcda">  receive · Acme · 2026-10-08</tspan></text><text class="ta19" x="30" y="236" xml:space="preserve"><tspan fill="#cfdcda">  $2,450.00 cash + $50.00 early-payment discount</tspan></text><text class="ta20" x="30" y="258" xml:space="preserve"><tspan fill="#6f8a88">  2,500.00 × 2% = 50.00  →  2,500.00 − 50.00 = 2,450.00</tspan></text><text class="ta21" x="30" y="302" xml:space="preserve"><tspan fill="#3ee6b0" font-weight="700">  ✓ 3 ledger lines posted · INV-2026-00001 is PAID</tspan></text></g>
