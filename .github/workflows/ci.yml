name: ci

# The test suite runs on main only, on the oldest supported Python; every
# supported Python runs weekly and by hand. Branches run the suite locally.
on:
  push:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  SHARDS: "5"
  SHA: ${{ github.sha }}

jobs:
  lock:
    name: lock and licences
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
      - run: uv sync --locked --all-extras --python 3.14
      - name: no Elastic, AGPL, SSPL or BUSL package
        run: uv run python tools/check_lock.py uv.lock --licenses
      - name: third-party notices are current
        run: uv run python tools/check_lock.py --check-notices

  collect:
    name: collect and plan (Python ${{ matrix.python }})
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(github.event_name == 'push' && '["3.12"]' || '["3.12", "3.14"]') }}
    # the same service and env as the shards, so the collected set is what the shards' environment collects
    services:
      postgres:
        image: postgres:18.6-trixie@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
        env:
          POSTGRES_USER: erpclaw
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: erpclaw_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U erpclaw"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
      - run: uv sync --locked --all-extras --python ${{ matrix.python }}
      - name: gitleaks 8.30.1, pinned by checksum (the push scanner's secrets engine)
        run: |
          curl -fsSLo /tmp/gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          echo "ERPCLAW_GITLEAKS=/tmp/gitleaks" >> "$GITHUB_ENV"
      - name: collect the node ids (pytest --collect-only -q)
        env:
          ERPCLAW_PG_TEST_URL: postgresql+psycopg://erpclaw:ci-only@127.0.0.1:5432/erpclaw_test
        run: uv run python tools/shard_suite.py collect --out "$RUNNER_TEMP/shard-plan/nodeids.txt"
      - name: plan shards (by durations when available, else by test count)
        run: |
          durations=()
          if [ -f .test_durations ]; then durations=(--durations .test_durations); fi
          uv run python tools/shard_suite.py split --collected "$RUNNER_TEMP/shard-plan/nodeids.txt" \
            --shards "$SHARDS" "${durations[@]}" --plan-out "$RUNNER_TEMP/shard-plan/plan.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: shard-plan-${{ matrix.python }}
          path: ${{ runner.temp }}/shard-plan/
          if-no-files-found: error
          overwrite: true

  shard:
    name: shard ${{ matrix.index }} (postgresql, Python ${{ matrix.python }})
    needs: collect
    # Cancellation may skip shards; the final job uses always() and rejects skipped prerequisites.
    if: ${{ !cancelled() && (github.event_name != 'push' || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false  # every shard reports, so the union shows every failure at once
      matrix:
        python: ${{ fromJSON(github.event_name == 'push' && '["3.12"]' || '["3.12", "3.14"]') }}
        index: [0, 1, 2, 3, 4]
    services:
      postgres:  # each shard runs with its own PostgreSQL service
        image: postgres:18.6-trixie@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
        env:
          POSTGRES_USER: erpclaw
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: erpclaw_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U erpclaw"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
      - run: uv sync --locked --all-extras --python ${{ matrix.python }}
      - name: gitleaks 8.30.1, pinned by checksum (the push scanner's secrets engine)
        run: |
          curl -fsSLo /tmp/gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          echo "ERPCLAW_GITLEAKS=/tmp/gitleaks" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: shard-plan-${{ matrix.python }}
          path: ${{ runner.temp }}/shard-plan
      - name: this shard's test files, from the plan
        env:
          INDEX: ${{ matrix.index }}
        run: |
          uv run python tools/shard_suite.py split --plan "$RUNNER_TEMP/shard-plan/plan.json" --index "$INDEX" \
            --files > "$RUNNER_TEMP/shard-files.txt"
          cat "$RUNNER_TEMP/shard-files.txt"
      - name: tests in this shard
        env:
          INDEX: ${{ matrix.index }}
          ERPCLAW_PG_TEST_URL: postgresql+psycopg://erpclaw:ci-only@127.0.0.1:5432/erpclaw_test
        run: |
          mapfile -t files < "$RUNNER_TEMP/shard-files.txt"
          # never run pytest without paths: that would be the whole suite
          (( ${#files[@]} > 0 )) || { echo "::error::shard $INDEX has no files"; exit 1; }
          uv run pytest -q --junitxml="$RUNNER_TEMP/junit/shard-$INDEX.xml" "${files[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: junit-${{ matrix.python }}-shard-${{ matrix.index }}
          path: ${{ runner.temp }}/junit/shard-${{ matrix.index }}.xml
          if-no-files-found: warn  # an absent report fails the union job, which names the shard
          overwrite: true

  test:
    name: tests (postgresql, Python ${{ matrix.python }})
    needs: [collect, shard]
    if: ${{ always() && (github.event_name != 'push' || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(github.event_name == 'push' && '["3.12"]' || '["3.12", "3.14"]') }}
    steps:
      - name: collection and shard jobs must succeed
        if: always()
        env:
          COLLECT_RESULT: ${{ needs.collect.result }}
          SHARD_JOBS_RESULT: ${{ needs.shard.result }}
        run: |
          if [ "$COLLECT_RESULT" != success ] || [ "$SHARD_JOBS_RESULT" != success ]; then
            echo "::error::Cannot verify tests: collect=$COLLECT_RESULT, shard=$SHARD_JOBS_RESULT; both must succeed."
            exit 1
          fi
      # After a prerequisite failure, check the union when its inputs are available for diagnostics.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        id: checkout
        if: ${{ always() && needs.collect.result == 'success' }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        id: plan
        if: ${{ always() && needs.collect.result == 'success' }}
        with:
          name: shard-plan-${{ matrix.python }}
          path: ${{ runner.temp }}/shard-plan
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        if: ${{ always() && steps.plan.outcome == 'success' }}
        continue-on-error: true  # no reports at all is still checked, and reported, by the next step
        with:
          pattern: junit-${{ matrix.python }}-shard-*
          merge-multiple: true
          path: ${{ runner.temp }}/junit
      - name: the union equals the collected set, every shard reported, and nothing failed
        if: ${{ always() && steps.checkout.outcome == 'success' && steps.plan.outcome == 'success' }}
        run: |
          mkdir -p "$RUNNER_TEMP/junit" "$RUNNER_TEMP/union"
          python3 tools/shard_suite.py check \
            --collected "$RUNNER_TEMP/shard-plan/nodeids.txt" --plan "$RUNNER_TEMP/shard-plan/plan.json" \
            --shards "$SHARDS" --junit-dir "$RUNNER_TEMP/junit" --sha "$SHA" \
            --summary "$GITHUB_STEP_SUMMARY" --report "$RUNNER_TEMP/union/report.json" \
            --write-durations "$RUNNER_TEMP/union/test_durations.json"
      - name: every shard job succeeded (pytest's own exit status, e.g. a strict xpass, counts too)
        if: always()
        env:
          SHARD_RESULT: ${{ needs.shard.result }}
        run: |
          [ "$SHARD_RESULT" = success ] || { echo "::error::the shard jobs ended '$SHARD_RESULT'"; exit 1; }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: union-${{ matrix.python }}
          path: ${{ runner.temp }}/union/
          if-no-files-found: warn
          overwrite: true
