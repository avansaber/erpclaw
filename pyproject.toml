[project]
name = "erpclaw-workspace"
version = "0.0.0"
description = "ERPClaw development workspace (not published)"
license = "GPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
  "erpclaw-core",
  "erpclaw-assistant",
  "erpclaw-api",
  "erpclaw-cli",
  "erpclaw-sales",
  "erpclaw-email-folder",
  "erpclaw-stock",
  "erpclaw-email",
]

[dependency-groups]
dev = ["pytest>=8.0", "hypothesis>=6.100", "aiosmtpd==1.4.6", "trustme==1.2.1"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "plugins/*"]

[tool.uv.sources]
erpclaw-core = { workspace = true }
erpclaw-assistant = { workspace = true }
erpclaw-api = { workspace = true }
erpclaw-cli = { workspace = true }
erpclaw-sales = { workspace = true }
erpclaw-email-folder = { workspace = true }
erpclaw-stock = { workspace = true }
erpclaw-email = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests", "tools/tests"]
