# Pins for token admission (row 0 of the token-admission spec). Read by nothing in the engine until the admission rows
# teach the loader these fields; profiles.toml and the profile loader are untouched by this file.
# vocab_* name the vocabulary artifact the count loads as data (tokenizer.json); the other files are pinned so a changed
# template, vocabulary or merges list is noticed. chat_template.jinja is not part of the counted representation.
# The SHA-256 of tokenizer.json equals the LFS object id the model repository reports for it at this revision.
#
# Admission is BOUNDED, not exact (ruling of dispatcher 1, 7 Nov): the count (ERPCLAW-COUNT-v1) is an upper estimate of
# what the model receives when  count * factor + constant  is used, with factor and constant measured per serving route
# (method envelope-v1): factor = 1.1 x the largest received/counted ratio among the fixture cases with at least 10 tools
# (rounded up to two places); constant = the largest residual (received - factor x counted) over ALL cases, plus 10
# percent, rounded up. The check re-derives both from the stored received counts and refuses on any difference.
# A profile whose margin_route is "unmeasured" is not admitted for exact-sized requests: it falls back to the
# conservative bound, as Muse does.

# The counting package is pinned as strictly as the vocabulary files, but NOT locked in uv.lock (a decision of the
# dispatcher: six more packages, one a native binary, for a tool a dispatcher with network runs rarely). It is installed
# ONLY with pip's hash enforcement (the verifier prints the exact lines for this platform), and the verifier refuses
# unless the installed version equals tool.version. Each platform's wheel has its own hash below; the wheel mode of the
# verifier (verify_tokenizer_pin.py wheel --file W) checks a downloaded wheel against them before it is installed.
[tool]
package = "tokenizers"
version = "0.22.1"

[[tool.wheel]]
platform = "linux_x86_64"
name = "tokenizers-0.22.1-cp39-abi3-manylinux_2_17_x86_64.manylinux2014_x86_64.whl"
sha256 = "e2ef6063d7a84994129732b47e7915e8710f27f99f3a3260b8a38fc7ccd083f4"

[[tool.wheel]]
platform = "win_amd64"
name = "tokenizers-0.22.1-cp39-abi3-win_amd64.whl"
sha256 = "65fd6e3fb11ca1e78a6a93602490f134d1fdeb13bcef99389d5102ea318ed138"

[[tool.wheel]]
platform = "macos_arm64"
name = "tokenizers-0.22.1-cp39-abi3-macosx_11_0_arm64.whl"
sha256 = "8d4e484f7b0827021ac5f9f71d4794aaef62b979ab7608593da22b1d2e3c4edc"

